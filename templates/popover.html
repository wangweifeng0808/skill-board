<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill Board</title>
<style>
  :root{
    --bg:#ffffff; --bg-sub:#f7f8fa; --bg-hover:#f2f4f7;
    --text:#16181d; --text-2:#5b6270; --text-3:#6e7684;
    --line:#e4e7ec; --line-soft:#eef0f4;
    --accent:#2563eb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1a1c1f; --bg-sub:#202327; --bg-hover:#282b30;
      --text:#e8eaed; --text-2:#a0a7b3; --text-3:#8b93a0;
      --line:#33373d; --line-soft:#2a2e33;
      --accent:#6f9bff;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
    font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;height:100vh;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:6px}

  .top{display:flex;align-items:center;gap:8px;padding:12px 14px 0}
  .top h1{font-size:15px;font-weight:500;letter-spacing:-.1px}
  .stamp{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .sp{flex:1}
  .icon-btn{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--text-2)}
  .icon-btn:hover{background:var(--bg-hover);color:var(--text)}
  .icon-btn.spin svg{animation:sp .6s linear}
  @keyframes sp{to{transform:rotate(360deg)}}

  .stats{display:flex;align-items:baseline;gap:12px;padding:7px 14px 10px}
  .count{font-size:20px;font-weight:500;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1}
  .count small{font-size:11px;font-weight:400;color:var(--text-2);letter-spacing:0;margin-left:3px}

  .chips{display:flex;gap:4px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;height:24px;display:inline-flex;align-items:center;gap:5px;padding:0 9px;
    border-radius:6px;color:var(--text-2);font-size:12px;white-space:nowrap;
  }
  .chip:hover{background:var(--bg-hover);color:var(--text)}
  .chip[aria-pressed=true]{background:var(--text);color:var(--bg)}
  .chip .dot{width:6px;height:6px;border-radius:50%}
  .chip .c{font-size:11px;opacity:.55;font-variant-numeric:tabular-nums}

  .searchwrap{padding:0 14px 10px}
  input[type=search]{
    width:100%;height:30px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg-sub);padding:0 10px;font-size:13px;color:var(--text);
    outline:none;font-family:inherit;-webkit-appearance:none;
  }
  input[type=search]::placeholder{color:var(--text-3)}
  input[type=search]:focus{border-color:var(--accent);background:var(--bg)}
  input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}

  .list{flex:1;overflow-y:auto;padding:0 8px 6px;overscroll-behavior:contain}
  .list::-webkit-scrollbar{width:9px}
  .list::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:3px solid var(--bg)}
  .list::-webkit-scrollbar-track{background:transparent}
  .row{display:flex;gap:9px;padding:6px 6px;border-radius:6px;width:100%;text-align:left;align-items:flex-start}
  .row:hover{background:var(--bg-hover)}
  .row .dot{width:6px;height:6px;border-radius:50%;margin-top:6px;flex:0 0 auto}
  .row .txt{flex:1;min-width:0}
  .row .n{display:block;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .n .sub{font-weight:400;color:var(--text-3);font-size:11px;margin-left:5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .row .d{display:block;color:var(--text-2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .row[aria-expanded=true] .d{white-space:normal}
  .row .src{font-size:11px;color:var(--text-3);flex:0 0 auto;margin-top:2px;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{color:var(--text-2);text-align:center;padding:44px 20px;font-size:12px;line-height:1.7}
  .empty button{color:var(--accent);font-size:12px;text-decoration:underline;text-underline-offset:2px;margin-top:6px;display:block;margin-left:auto;margin-right:auto}
  mark{background:#fde68a;color:#16181d;border-radius:2px}
  @media (prefers-color-scheme:dark){ mark{background:#5c4a12;color:#f5e6b8} }

  .foot{border-top:1px solid var(--line-soft);padding:8px 14px;display:flex;align-items:center;gap:8px;background:var(--bg-sub)}
  .foot .hint{font-size:11px;color:var(--text-3);flex:1}
  .foot button{height:26px;padding:0 11px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-size:12px}
  .foot button:hover{background:var(--bg-hover)}
  .foot button.primary{background:var(--accent);color:#fff;border-color:transparent}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
  <div class="top">
    <h1 id="brand">Skill Board</h1>
    <div class="stamp" id="stamp"></div>
    <div class="sp"></div>
    <button class="icon-btn" id="refresh" title="重新扫描" aria-label="重新扫描">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
      </svg>
    </button>
  </div>

  <div class="stats">
    <div class="count" id="tTotal">0<small>skills</small></div>
    <div class="count" id="tAgent" style="font-size:15px">0<small>agents</small></div>
  </div>

  <div class="chips" id="chips" role="group" aria-label="按来源筛选"></div>
  <div class="searchwrap"><input id="q" type="search" placeholder="搜索名称、描述或分类" autocomplete="off" spellcheck="false" aria-label="搜索 skill"></div>

  <div class="list" id="list" role="list"></div>

  <div class="foot">
    <div class="hint">点一行展开描述</div>
    <button id="openFull" class="primary">完整看板</button>
  </div>

<script>
const DATA = /*__DATA__*/;
document.title = DATA.title || "Skill Board";
(function(){const b=document.getElementById("brand"); if(b&&DATA.title) b.textContent=DATA.title;})();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const agentMap = Object.fromEntries(DATA.agents.map(a=>[a.key,a]));
const colorOf = k => (agentMap[k]||{}).color || "#888";
const labelOf = k => (agentMap[k]||{}).label || k;
const shortOf = k => (agentMap[k]||{}).short || labelOf(k);
const state = { q:"", agent:"all", open:new Set() };

function post(msg){ try{ window.webkit.messageHandlers.board.postMessage(msg);}catch(e){} }

$("#stamp").textContent = (DATA.generated_at||"").slice(5,16);
$("#tTotal").innerHTML = DATA.total + "<small>skills</small>";
$("#tAgent").innerHTML = DATA.agents.filter(a=>a.count>0).length + "<small>agents</small>";

function renderChips(){
  const el = $("#chips");
  let h = `<button class="chip" data-a="all" aria-pressed="${state.agent==="all"}">全部 <span class="c">${DATA.total}</span></button>`;
  DATA.agents.filter(a=>a.count).forEach(a=>{
    h += `<button class="chip" data-a="${a.key}" aria-pressed="${state.agent===a.key}"><span class="dot" style="background:${a.color}"></span>${esc(a.short||a.label)} <span class="c">${a.count}</span></button>`;
  });
  el.innerHTML = h;
  el.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ state.agent=c.dataset.a; renderChips(); render(); });
}

function mark(t){
  if(!state.q) return esc(t);
  const i = t.toLowerCase().indexOf(state.q.toLowerCase());
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+state.q.length))+"</mark>"+esc(t.slice(i+state.q.length));
}

function render(){
  const q = state.q.toLowerCase();
  let list = DATA.skills.filter(s=>{
    if(state.agent!=="all" && s.agent!==state.agent) return false;
    if(!q) return true;
    return (s.name+" "+s.slug+" "+(s.display||"")+" "+s.desc+" "+s.desc_en+" "+s.category).toLowerCase().includes(q);
  });
  list.sort((a,b)=> a.agent===b.agent ? (a.display||a.name).localeCompare(b.display||b.name,"zh")
                                      : DATA.agents.findIndex(x=>x.key===a.agent)-DATA.agents.findIndex(x=>x.key===b.agent));
  const el = $("#list");
  if(!list.length){
    el.innerHTML = `<div class="empty">没有匹配的 skill<button id="clearAll">清除筛选条件</button></div>`;
    const c = $("#clearAll");
    if(c) c.onclick = ()=>{ state.q=""; state.agent="all"; $("#q").value=""; renderChips(); render(); };
    return;
  }
  el.innerHTML = list.map(s=>{
    const id = s.agent+"::"+s.slug;
    const open = state.open.has(id);
    const title = s.display || s.name;
    const sub = s.display ? s.name : "";
    return `<button class="row" role="listitem" data-id="${esc(id)}" aria-expanded="${open}">
      <span class="dot" style="background:${colorOf(s.agent)}"></span>
      <span class="txt">
        <span class="n">${mark(title)}${sub?`<span class="sub">${mark(sub)}</span>`:""}</span>
        <span class="d">${mark(s.desc || s.desc_en || "（无描述）")}</span>
      </span>
      <span class="src">${esc(shortOf(s.agent))}</span>
    </button>`;
  }).join("");
  el.querySelectorAll(".row").forEach(r=>r.onclick=()=>{
    const id = r.dataset.id;
    if(state.open.has(id)) state.open.delete(id); else state.open.add(id);
    r.setAttribute("aria-expanded", state.open.has(id) ? "true" : "false");
  });
}

$("#q").addEventListener("input", e=>{ state.q = e.target.value.trim(); render(); });
$("#refresh").onclick = () => { const b=$("#refresh"); b.classList.add("spin"); setTimeout(()=>b.classList.remove("spin"),700); post("refresh"); };
$("#openFull").onclick = () => post("open-full");
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if(state.q){ $("#q").value=""; state.q=""; render(); } else post("close"); }
  if(e.metaKey && e.key==="f"){ e.preventDefault(); $("#q").focus(); }
});

renderChips(); render();
</script>
</body>
</html>
